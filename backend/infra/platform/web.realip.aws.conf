# Solo para AWS (compose.aws.yaml). CloudFront agrega la IP del visitante al FINAL de X-Forwarded-For.
# Con real_ip_recursive off, nginx toma la última dirección de la cabecera: la que puso CloudFront, no la que pueda inventar el cliente.
# Es seguro porque el Security Group de la EC2 solo acepta conexiones desde CloudFront (prefix list com.amazonaws.global.cloudfront.origin-facing).
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
