server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 52m;
  include /etc/nginx/web-security-headers.conf;
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    # M8: la IP real del cliente, sin la cadena que él mande: el gateway toma el último valor (TRAZATEX_RATE_LIMIT_TRUSTED_HOPS=1)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 35s;
  }
  # FE-M10: index.html nunca se reutiliza sin preguntar al servidor; si no, tras un despliegue el navegador pediría chunks con hash que ya no existen.
  # /, /login y cualquier ruta de la SPA terminan aquí (try_files hace una redirección interna a /index.html). Los chunks llevan hash en el nombre.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/web-security-headers.conf;
  }
  location = /login { try_files /index.html =404; }
  location / { try_files $uri /index.html; }
}
