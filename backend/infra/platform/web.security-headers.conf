# FE-I6: cabeceras de seguridad de la web. Se incluye en `server` y en cada `location` que declare sus propios `add_header`
# (en nginx, un add_header dentro de un location anula TODOS los del nivel superior).
# Sin HSTS: la web se sirve por HTTP (127.0.0.1) y Strict-Transport-Security solo vale sobre TLS.
#
# CSP compatible con la app Angular:
#  - script-src: solo 'self'. El hash autoriza el manejador `onload="this.media='all'"` que Angular escribe en index.html para cargar
#    el CSS de forma diferida (es el SHA-256 de ese texto; una prueba del front lo recalcula). 'unsafe-hashes' es lo que permite el hash en un atributo.
#  - style-src 'unsafe-inline': Angular inserta <style> en tiempo de ejecución y las plantillas usan style="…".
#  - img-src https: data: blob:: las evidencias vienen de una URL https del servicio de archivos, y las vistas previas son blob:.
#  - connect-src 'self': la API va por /api del mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
