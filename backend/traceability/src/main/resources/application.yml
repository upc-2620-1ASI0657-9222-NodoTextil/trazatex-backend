spring:
  application:
    name: traceability
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}

  jackson:
    default-property-inclusion: non_null

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health

trazatex:
  messaging:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    partitions: 1
    replicas: 1
    modify-topic-configs: true
    consumer:
      batch:
        group: traceability.production-batch
      transformation:
        group: traceability.production-transformation
      transfer:
        group: traceability.production-transfer
      company:
        group: traceability.orgaccess-company
      quality:
        group: traceability.quality-control
      failure:
        group: traceability.quality-failure
      topic-check-interval: PT15S
      retry:
        max-retries: 5
        initial-interval: PT1S
        multiplier: 2.0
        max-interval: PT30S
      impact-retry:
        max-retries: 10
        initial-interval: PT1S
        multiplier: 2.0
        max-interval: PT60S
      max-poll-interval: PT5M
      neo4j-retry:
        attempts: 5
        backoff: PT0.05S
