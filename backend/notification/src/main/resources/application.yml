spring:
  application:
    name: notification
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      missing-topics-fatal: false
trazatex:
  messaging:
    consumer:
      topic-check-interval: PT15S
  mail:
    job-delay: PT30S
    # Intentos por correo antes de pasar a FAILED (espera creciente de 30 s a 1 h entre intentos)
    max-attempts: 8
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health

