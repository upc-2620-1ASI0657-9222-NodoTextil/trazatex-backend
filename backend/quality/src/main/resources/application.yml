spring:
  application:
    name: quality
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
      file-size-threshold: 1MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

server:
  port: 8083
  tomcat:
    max-swallow-size: 60MB
trazatex:
  production:
    base-url: ${PRODUCTION_URL:http://localhost:8082}
    connect-timeout: PT1S
    read-timeout: PT2S
    retry: {max-attempts: 2, wait-duration: PT0.3S}
    circuit-breaker: {sliding-window-size: 10, minimum-calls: 5, failure-rate-threshold: 50, wait-in-open-state: PT30S, half-open-calls: 2}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    base-url: https://api.cloudinary.com
    connect-timeout: PT2S
    read-timeout: PT8S
    circuit-breaker: {sliding-window-size: 10, minimum-calls: 5, failure-rate-threshold: 50, wait-in-open-state: PT30S, half-open-calls: 2}
  evidence:
    max-files: 5
    max-file-size: 10MB
    upload:
      enabled: true
      job-delay: PT30S
      job-initial-delay: PT10S
      initial-delay: PT30S
      claims-per-run: 5
      lease: PT5M
      not-available-delay: PT5M
      max-attempts: 30
      multiplier: 2.0
      max-delay: PT30M
  quality:
    start:
      grace: PT30S
      claims-per-run: 10
      lease: PT2M
      initial-delay: PT15S
      multiplier: 2.0
      max-delay: PT5M
      error-after-attempts: 20
      job-enabled: true
      job-initial-delay: PT10S
      job-delay: PT15S
  idempotency:
    cleanup-job-delay: PT1H
  messaging:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    partitions: 1
    replicas: 1
    modify-topic-configs: true
    consumer:
      topic-check-interval: PT15S
      retry:
        max-retries: 5
        initial-interval: PT1S
        multiplier: 2.0
        max-interval: PT30S
