spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            # Chequea.pe (3 s) corre dentro de "crear empresa": este tope deja margen y evita colgar al frontend
            response-timeout: 30s
          # CORS se configura solo aquí (api.md); los servicios no lo hacen. Autenticación por cabecera Bearer: sin cookies
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${TRAZATEX_FRONTEND_URL:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Accept,Idempotency-Key
                exposed-headers: Retry-After,Location
                allow-credentials: false
                max-age: 3600
          # Las rutas de los seis servicios de api.md (cada URL se configura abajo, en trazatex.gateway.services).
          # /internal/** no se enruta nunca (solo red interna). /.well-known/jwks.json no se expone: el Gateway
          # lo lee directo de JWKS_URI.
          routes:
            - id: organization-access
              uri: ${trazatex.gateway.services.organization-access-url}
              predicates:
                - Path=/api/auth/**,/api/license/**,/api/companies/**,/api/users/**,/api/invitations/**,/api/admin-requests/**,/api/privacy-settings/**
            # Fase 04 (production). Las evidencias (multipart de hasta 5 × 10 MB) pasan tal cual: el Gateway no limita ni lee el cuerpo
            - id: production
              uri: ${trazatex.gateway.services.production-url}   # PRODUCTION_URL, por defecto http://localhost:8082
              predicates:
                - Path=/api/batches/**,/api/machines/**,/api/transformations/**,/api/transfers/**
            # Fase 05 (traceability). Todo lo que sale por esta ruta lleva Cache-Control: no-store (NoStoreWebFilter), también los errores del Gateway
            - id: traceability
              uri: ${trazatex.gateway.services.traceability-url}   # TRACEABILITY_URL, por defecto http://localhost:8084
              predicates:
                - Path=/api/traceability/**
            # Fase 06 (quality). El comando interno Quality → Production (/internal/**) no pasa por aquí: el Gateway le responde 404
            - id: quality
              uri: ${trazatex.gateway.services.quality-url}   # QUALITY_URL, por defecto http://localhost:8083
              predicates:
                - Path=/api/quality/**
            - id: notification
              uri: ${trazatex.gateway.services.notification-url}   # NOTIFICATION_URL, por defecto http://localhost:8085
              predicates:
                - Path=/api/notifications/**
            - id: analytics
              uri: ${trazatex.gateway.services.analytics-url}   # ANALYTICS_URL, por defecto http://localhost:8086
              predicates:
                - Path=/api/analytics/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # RF-012: no está listo hasta haber leído orgaccess.user completo (contributor "revocation")
          include: readinessState,revocation

trazatex:
  rate-limit:
    # Bucket4j en memoria (sin Redis). 429 con Retry-After y ApiError. Todo configurable.
    login: {permits: 60, window: PT1M}        # POST /api/auth/login, por IP (en una planta muchos operarios comparten IP; RNF-06 ya bloquea por cuenta)
    invitation: {permits: 30, window: PT1M}   # GET/POST de invitaciones por enlace, por IP
    user: {permits: 120, window: PT1M}        # rutas autenticadas, por userId...
    company: {permits: 600, window: PT1M}     # ...y por empresa, a la vez (el Dueño, sin empresa, solo usa el de usuario)
    # Peticiones por IP a rutas protegidas SIN credencial válida (sin token o con uno que no es nuestro); pasado el límite reciben
    # 429 en vez de 401. No cuentan token vencido ni usuario inactivo (sesiones reales) ni frenan a quien trae un token válido
    auth-failure: {permits: 300, window: PT1M}
    # Los cubos inactivos se descartan (Caffeine); no puede ser menor que la ventana más larga
    idle-expiry: PT10M
    max-entries: 100000                       # tope de cubos por ámbito
    # La IP es la dirección de la CONEXIÓN. Un X-Forwarded-For del cliente nunca se usa. En Azure (ingress delante) poner
    # true: se toma el valor que agrega el ingress (el de más a la derecha, o el trusted-hops-ésimo desde la derecha)
    # Variables explícitas (el relaxed binding de Spring no cruza los guiones de rate-limit): TRAZATEX_RATE_LIMIT_TRUST_FORWARDED_FOR
    # y TRAZATEX_RATE_LIMIT_TRUSTED_HOPS
    trust-forwarded-for: ${TRAZATEX_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    trusted-hops: ${TRAZATEX_RATE_LIMIT_TRUSTED_HOPS:1}
  revocation:
    # RF-012: el Gateway lee orgaccess.user (compactado) sin grupo, desde el inicio, y responde 401 a los tokens de usuarios
    # INACTIVE. No está listo (readiness) ni deja pasar rutas autenticadas (503) hasta terminar de leerlo.
    # enabled=false SOLO para pruebas sin Kafka.
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: orgaccess.user
    poll-timeout: PT0.2S
    retry-initial-backoff: PT1S
    retry-max-backoff: PT30S
    api-timeout: PT10S
  jwt:
    # ADR-005: claves públicas de organization-access (RS256). Caché de 5 min; ante un kid desconocido se vuelve a pedir
    # como máximo cada 30 s; si organization-access cae se sigue con la caché hasta 8 h (la vigencia del JWT)
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    cache-ttl: PT5M
    min-reload-interval: PT30S
    # Solo mientras el JWKS no se haya cargado nunca (organization-access caído al arrancar)
    failure-retry-interval: PT5S
    outage-tolerance: PT8H
    connect-timeout: PT2S
    read-timeout: PT2S
    clock-skew: PT30S
  gateway:
    services:
      organization-access-url: ${ORGANIZATION_ACCESS_URL:http://localhost:8081}
      production-url: ${PRODUCTION_URL:http://localhost:8082}
      traceability-url: ${TRACEABILITY_URL:http://localhost:8084}
      quality-url: ${QUALITY_URL:http://localhost:8083}
      notification-url: ${NOTIFICATION_URL:http://localhost:8085}
      analytics-url: ${ANALYTICS_URL:http://localhost:8086}
