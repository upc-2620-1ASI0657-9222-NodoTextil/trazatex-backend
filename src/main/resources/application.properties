spring.application.name=trazatex-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trazatex}
spring.datasource.username=${DB_USERNAME:trazatex}
spring.datasource.password=${DB_PASSWORD:trazatex}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:trazatex-pass}

app.security.jwt-issuer=${JWT_ISSUER:trazatex}
app.external-services.enabled=${EXTERNAL_SERVICES_ENABLED:false}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

app.sunat.base-url=${SUNAT_BASE_URL:}
app.sunat.api-token=${SUNAT_API_TOKEN:}
app.hibp.base-url=${HIBP_BASE_URL:https://api.pwnedpasswords.com}
app.pdfmonkey.api-key=${PDFMONKEY_API_KEY:}
app.pdfmonkey.template-id=${PDFMONKEY_TEMPLATE_ID:}
app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

resilience4j.circuitbreaker.instances.sunat.sliding-window-size=10
resilience4j.circuitbreaker.instances.sunat.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sunat.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.hibp.sliding-window-size=10
resilience4j.circuitbreaker.instances.hibp.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hibp.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.cloudinary.sliding-window-size=10
resilience4j.circuitbreaker.instances.cloudinary.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cloudinary.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.pdfmonkey.sliding-window-size=10
resilience4j.circuitbreaker.instances.pdfmonkey.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pdfmonkey.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sendgrid.sliding-window-size=10
resilience4j.circuitbreaker.instances.sendgrid.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sendgrid.wait-duration-in-open-state=30s
resilience4j.retry.instances.sendgrid.max-attempts=3
resilience4j.retry.instances.sendgrid.wait-duration=1s
