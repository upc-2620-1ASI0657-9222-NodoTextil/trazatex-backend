spring.application.name=trazatex-backend

# PostgreSQL (Production, Quality, Organization)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trazatex}
spring.datasource.username=${DB_USER:trazatex}
spring.datasource.password=${DB_PASSWORD:trazatex}
spring.jpa.hibernate.ddl-auto=update

# Neo4j (Traceability)
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:trazatex-pass}
